name: Resolve Google Maps destination coordinates
on:
  push:
    paths:
      - index.html
      - scripts/resolve_maps.py
      - .github/workflows/resolve-maps.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/resolve_maps.py
      - name: Commit verified coordinates
        run: |
          if ! git diff --quiet -- map-coordinates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add map-coordinates.json
            git commit -m "Update verified Google Maps coordinates"
            git push
          fi
