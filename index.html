<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243b"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>納品先ナビ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#14283c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#10243b;color:white;padding:25px 18px 20px}h1{font-size:24px;margin:0 0 7px}header p{margin:0;color:#b7c9db;font-size:13px}main{max-width:700px;margin:auto;padding:16px}.bar{display:flex;gap:8px;margin:0 0 15px}input,select,textarea{width:100%;border:1px solid #d4dce6;border-radius:11px;padding:13px;font:inherit;background:white}textarea{min-height:80px}button,.btn{border:0;border-radius:11px;background:#1767a7;color:white;padding:12px 15px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}.secondary{background:#e8eff6;color:#163c60}.danger{background:#fff0ef;color:#a32626}.card{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #12253a0b}.muted{color:#66788b;font-size:13px}.tag{display:inline-block;background:#eaf3fc;color:#195b8e;padding:4px 9px;border-radius:99px;font-size:12px;margin-bottom:7px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions>*{flex:1}h2{font-size:18px;margin:6px 0 12px}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600}.hidden{display:none}img.photo{max-width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-top:10px}#notice{font-size:12px;color:#6b7685;line-height:1.7}.empty{text-align:center;padding:35px;color:#657589}footer{padding:20px 0 35px}
</style></head><body><header><h1>🚚 納品先ナビ</h1><p>事務所・倉庫・現場の情報をスマホで管理</p></header><main>
<section id="home"><div class="bar"><input id="search" placeholder="🔎 お客様名・現場名・住所で検索"><button id="add">＋登録</button></div><div id="count" class="muted"></div><div class="actions"><button class="secondary" id="reloadApp" type="button">🔄 最新データを確認</button></div><p class="muted">アプリ版: 2026.10.29.35 / 大元の登録: 35件</p><div id="list"></div><footer><div class="actions"><button class="secondary" id="export">バックアップ保存</button><button class="secondary" id="importBtn">バックアップ読込</button></div><input class="hidden" type="file" accept="application/json" id="importFile"><p id="notice">情報はこの端末のブラウザ内だけに保存されます。他のスマホには自動共有されません。ブラウザのデータ削除・端末変更に備え、定期的にバックアップしてください。写真は容量を使うため、少数・小さめの画像をおすすめします。</p></footer></section>
<section id="editor" class="hidden"><h2 id="formTitle">納品先を登録</h2><form id="form"><input type="hidden" id="id"><label>お客様名 *</label><input id="customer" required maxlength="100" placeholder="例：山田設備株式会社"><label>納品先名 *</label><input id="place" required maxlength="100" placeholder="例：本社・資材倉庫・〇〇新築現場"><label>区分</label><select id="kind"><option>事務所</option><option>倉庫</option><option>現場</option><option>その他</option></select><label>住所（地図リンクがある場合は省略可）</label><input id="address" placeholder="例：山梨県甲府市〇〇"><label>Googleマップ共有リンク（任意）</label><input id="maplink" type="url" placeholder="正確な搬入口のピンURL"><label>搬入・受付・駐車の注意事項</label><textarea id="memo" placeholder="例：建物裏のシャッターから搬入。受付に声をかける"></textarea><label>現場写真（任意）</label><input type="file" id="photoFile" accept="image/*"><div id="photoPreview"></div><div class="actions"><button type="button" class="secondary" id="cancel">戻る</button><button type="submit">保存する</button></div></form></section></main>

const $=id=>document.getElementById(id);

photo":""},{"id":"official-dobashi-setsubi-kogyo-home-001","customer":"土橋設備工業","place":"自宅","kind":"その他","address":"","maplink":"https://maps.app.goo.gl/v1cwBtNwfnANF8ur9?g_st=ic","memo":"Googleマップ共有リンク登録（住所未確認）","photo":""},{"id":"official-house-partner-newlife-home-001","customer":"ハウスパートナーニューライフ","place":"自宅","kind":"その他","address":"","maplink":"https://maps.app.goo.gl/qfuvb6wk5ZzK138x9?g_st=ic","memo":"Googleマップ共有リンク登録（住所未確認）","photo":""},{"id":"official-house-partner-newlife-hinoharu-warehouse-001","customer":"ハウスパートナーニューライフ","place":"日野春倉庫","kind":"倉庫","address":"","maplink":"https://maps.app.goo.gl/xkCuQzQMfjGziXbN8?g_st=ic","memo":"Googleマップ共有リンク登録（住所未確認）","photo":""},{"id":"official-omori-setsubi-office-001","customer":"大森設備","place":"事務所","kind":"事務所","address":"","maplink":"https://maps.app.goo.gl/mef623Ee96LaXGog6?g_st=ic","memo":"Googleマップ共有リンク登録（住所未確認）","photo":""}];
const REMOVED_KEY='nouhinsaki-navi-removed-defaults';
function removed(){try{return JSON.parse(localStorage.getItem(REMOVED_KEY)||'[]')}catch(e){return []}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(v)?v:[]}catch(e){items=[]}let deleted=removed();for(let x of DEFAULTS){if(!deleted.includes(x.id)&&!items.some(y=>y.id===x.id))items.push({...x})}}

function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('保存できませんでした。写真の容量を減らすか、端末の空き容量を確認してください。');return false}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapurl(x){if(x.maplink&&/^https:\/\/(www\.)?(google\.[^/]+|maps\.app\.goo\.gl)\//i.test(x.maplink))return x.maplink;return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address)}
function showEditor(x){$('home').classList.add('hidden');$('editor').classList.remove('hidden');$('formTitle').textContent=x?'納品先を編集':'新しい納品先を登録';for(let k of ['id','customer','place','kind','address','maplink','memo'])$(k).value=x?.[k]|| (k==='kind'?'現場':'');photo=x?.photo||'';$('photoFile').value='';preview();window.scrollTo(0,0)}
function preview(){$('photoPreview').innerHTML=photo?'<img class="photo" alt="納品先写真" src="'+photo+'"><div><button type="button" class="secondary" id="removePhoto">写真を削除</button></div>':'';if(photo)$('removePhoto').onclick=()=>{photo='';preview()}}
function home(){$('editor').classList.add('hidden');$('home').classList.remove('hidden');render();window.scrollTo(0,0)}
function render(){let q=$('search').value.trim().toLowerCase();let a=items.filter(x=>[x.customer,x.place,x.kind,x.address,x.memo].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' 件の納品先';$('list').innerHTML=a.length?a.map(x=>'<article class="card"><span class="tag">'+esc(x.kind)+'</span><h2>'+esc(x.customer)+'</h2><strong>'+esc(x.place)+'</strong><p class="muted">📍 '+esc(x.address)+'</p>'+(x.memo?'<p style="white-space:pre-wrap">'+esc(x.memo)+'</p>':'')+(x.photo?'<img class="photo" alt="納品先写真" src="'+x.photo+'">':'')+'<div class="actions"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(mapurl(x))+'">📍 Googleマップ</a><button class="secondary edit" data-id="'+esc(x.id)+'">編集</button><button class="danger del" data-id="'+esc(x.id)+'">削除</button></div></article>').join(''):'<div class="empty">納品先がありません。＋登録から追加できます。</div>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>showEditor(items.find(x=>x.id===b.dataset.id)));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('この納品先を削除しますか？')){let old=items;items=items.filter(x=>x.id!==b.dataset.id);if(!save())items=old;else if(DEFAULTS.some(x=>x.id===b.dataset.id)){try{localStorage.setItem(REMOVED_KEY,JSON.stringify([...new Set([...removed(),b.dataset.id])]))}catch(e){}}render()}})}
$('reloadApp').onclick=()=>{const u=new URL(location.href);u.searchParams.set('refresh',String(Date.now()));location.replace(u.toString())};$('add').onclick=()=>showEditor(null);$('cancel').onclick=home;$('search').oninput=render;
$('photoFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){alert('10MB以下の写真を選んでください');return}try{let img=new Image();let url=URL.createObjectURL(f);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,1000/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(url);preview()}catch(err){alert('写真を読み込めませんでした')}};
$('form').onsubmit=e=>{e.preventDefault();let x={};for(let k of ['id','customer','place','kind','address','maplink','memo'])x[k]=$(k).value.trim();if(!x.address&&!x.maplink){alert('住所またはGoogleマップ共有リンクを入力してください');return}x.id=x.id||String(Date.now())+'-'+Math.random().toString(36).slice(2);x.photo=photo;let old=items.slice(),i=items.findIndex(y=>y.id===x.id);if(i<0)items.unshift(x);else items[i]=x;if(save())home();else items=old};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'nouhinsaki-navi',version:1,items},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='納品先ナビ_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='nouhinsaki-navi'||!Array.isArray(data.items))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えます。続けますか？'))return;let old=items;items=data.items.filter(x=>x&&typeof x.id==='string'&&typeof x.customer==='string'&&typeof x.address==='string');if(!save())items=old;render()}catch(err){alert('対応するバックアップファイルではありません')}finally{e.target.value=''}};
load();render();
</script></body></html>
