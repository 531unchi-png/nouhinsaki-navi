function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function mapurl(x){const address=String(x.address||'').trim();const coord=/^-?\d{1,2}\.\d+\s*,\s*-?\d{1,3}\.\d+$/;const plus=address.match(/(?:^|\s)([23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3})(?=\s|$)/i);let query='';if(address){if(normalizeCoordinates(address)){query=normalizeCoordinates(address);}else if(plus){const region=address.replace(plus[1],'').trim();query=plus[1].toUpperCase()+' '+(region||'山梨県');}else query=address;}else if(verifiedCoordinates[x.id])query=verifiedCoordinates[x.id];if(query)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);const link=String(x.maplink||'').trim();if(/^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(?:www\.)?google\.[^/]+\/maps)(\/|$)/i.test(link))return link.replace(/[?&]g_st=[^&#]*/i,'').replace(/[?&]$/,'');return ''}
function normalizeCoordinates(v){const t=String(v||'').trim().replace(/^[（(]\s*/,'').replace(/\s*[）)]$/,'').replace(/，/g,',').trim();const m=t.match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);if(!m)return null;const lat=Number(m[1]),lon=Number(m[2]);return Math.abs(lat)<=90&&Math.abs(lon)<=180?m[1]+','+m[2]:null}
function detectLocationType(value){const v=String(value||'').trim();if(normalizeCoordinates(v))return 'coordinates';if(/[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}/i.test(v))return 'pluscode';return 'address'}
function updateLocationField(){const type=$('locationType').value;const info={address:['住所','例：山梨県甲府市丸の内1-1-1','住所を入力してください。'],coordinates:['座標（緯度,経度）','例：35.7033627,138.4553752','Googleマップの緯度,経度を入力してください。'],pluscode:['Plus Code（地域名も入力）','例：PF34+5HV 韮崎市 山梨県','短いPlus Codeは市町村名も一緒に入力してください。']}[type];$('locationLabel').textContent=info[0];$('address').placeholder=info[1];$('locationHelp').textContent=info[2]}
$('locationType').onchange=updateLocationField;
function customerNames(){return [...new Set(items.map(x=>String(x.customer||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'))}
function closeCustomerSuggestions(){$('customerSuggestions').classList.add('hidden');$('customerToggle').setAttribute('aria-expanded','false')}
function showCustomerSuggestions(all=false){const q=normalizeSearch($('customer').value);const names=customerNames().filter(n=>all||!q||normalizeSearch(n).includes(q)||(CUSTOMER_READINGS[n]&&normalizeSearch(CUSTOMER_READINGS[n]).includes(q)));const el=$('customerSuggestions');el.replaceChildren();if(!names.length){const hint=document.createElement('div');hint.className='empty-hint';hint.textContent='該当なし。このまま新しいお客様名で登録できます。';el.append(hint)}else for(const name of names){const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.textContent=name;b.onclick=()=>{$('customer').value=name;closeCustomerSuggestions();$('place').focus()};el.append(b)}el.classList.remove('hidden');$('customerToggle').setAttribute('aria-expanded','true')}
$('customer').addEventListener('input',()=>showCustomerSuggestions(false));
$('customer').addEventListener('focus',()=>{if($('customer').value.trim())showCustomerSuggestions(false)});
$('customerToggle').onclick=()=>{$('customerSuggestions').classList.contains('hidden')?showCustomerSuggestions(true):closeCustomerSuggestions()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.customer-picker'))closeCustomerSuggestions()});
function showEditor(x){closeCustomerSuggestions();$('home').classList.add('hidden');$('editor').classList.remove('hidden');$('formTitle').textContent=x?'納品先を編集':'新しい納品先を登録';for(let k of ['id','customer','place','kind','address','maplink','memo'])$(k).value=x?.[k]|| (k==='kind'?'現場':'');if(x&&!['事務所','倉庫','現場','自宅','その他'].includes(x.kind))$('kind').value=destinationType(x);$('folder').value=x?(x.folder===undefined?'411C':x.folder||''):'';$('locationType').value=detectLocationType(x?.address||'');updateLocationField();photo=x?.photo||'';$('photoFile').value='';preview();window.scrollTo(0,0)}
function preview(){$('photoPreview').innerHTML=photo?'<img class="photo" alt="納品先写真" src="'+photo+'"><div><button type="button" class="secondary" id="removePhoto">写真を削除</button></div>':'';if(photo)$('removePhoto').onclick=()=>{photo='';preview()}}
function home(){$('editor').classList.add('hidden');$('home').classList.remove('hidden');render();window.scrollTo(0,0)}
const CUSTOMER_READINGS={"有限会社小澤設備":"おざわせつび","有限会社長井工業":"ながいこうぎょう","関設備":"せきせつび","ウエマツ":"うえまつ","中央水道":"ちゅうおうすいどう","有限会社ハヤカワ":"はやかわ","株式会社セントラルサービス":"せんとらるさーびす","有限会社峡中建設":"きょうちゅうけんせつ","有限会社清水水道":"しみずすいどう","株式会社ヤモト工業":"やもとこうぎょう","有限会社竹内工業":"たけうちこうぎょう","有限会社山一建設":"やまいちけんせつ","有限会社相馬組":"そうまぐみ","有限会社中島工業所":"なかじまこうぎょうしょ","セイノ設備":"せいのせつび","韮崎市上水道工事協同組合":"にらさきしじょうすいどうこうじきょうどうくみあい","土橋設備工業":"どばしせつびこうぎょう","ハウスパートナーニューライフ":"はうすぱーとなーにゅーらいふ","大森設備":"おおもりせつび","仲澤設備":"なかざわせつび","神原設備":"かんばらせつび","細田設備":"ほそだせつび","御用聞屋伊藤":"ごようききやいとう","中込建設":"なかごみけんせつ","小澤工業株式会社":"おざわこうぎょう","株式会社すずき":"すずき","金物しょっぷすずき":"かなものしょっぷすずき","アクアワークス":"あくあわーくす","峡北建設株式会社":"きょうほくけんせつ","株式会社司設備":"つかさせつび","木本建設":"きもとけんせつ","山栄設備":"さんえいせつび","長田興業株式会社":"おさだこうぎょう","清里建設有限会社":"きよさとけんせつ","有限会社宮沢工務店":"みやざわこうむてん","有限会社高橋建築舎":"たかはしけんちくしゃ","坂本水設":"さかもとすいせつ","濱尾設備工業":"はまおせつびこうぎょう","峡北工業株式会社":"きょうほくこうぎょう","駒井土建株式会社":"こまいどけん","古屋管工":"ふるやかんこう","昭和土地建設":"しょうわとちけんせつ","創進工業":"そうしんこうぎょう","甲府冷暖工業株式会社":"こうふれいだんこうぎょう"};
function normalizeSearch(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s\u3000・･()（）\-ー]/g,'')}
function searchText(x){let name=String(x.customer||'');let reading=CUSTOMER_READINGS[name]||'';let stripped=name.replace(/株式会社|有限会社|合同会社|（株）|\(株\)/g,'');return [name,stripped,reading,x.place,x.kind,x.address,x.memo].map(normalizeSearch).join(' ')}
function searchMatch(x,q){if(!q)return true;let terms=q.split(/\s+/).map(normalizeSearch).filter(Boolean),hay=searchText(x);return terms.every(t=>hay.includes(t))}

let activeFilter='すべて';
let folderOpen=false;

function destinationType(x){
 const kind=String(x.kind||'').trim(),p=String(x.place||'').trim();
 if(['事務所','倉庫','現場','自宅','その他'].includes(kind)){
  if(kind==='その他'&&/自宅|社長宅|専務宅|家$/.test(p))return '自宅';
  return kind;
 }
 if(/自宅|社長宅|専務宅|家$/.test(p))return '自宅';
 if(/倉庫|資材庫/.test(p))return '倉庫';
 if(/事務所|営業所|本社/.test(p))return '事務所';
 if(/現場|新築|工事/.test(p))return '現場';
 return 'その他';
}
function iconFor(type){return type==='事務所'?'▥':type==='自宅'?'⌂':type==='倉庫'?'▤':'⌖'}
function classFor(type){return type==='事務所'?'office':type==='自宅'?'home':type==='倉庫'?'warehouse':'other'}
const FOLDERS=['411C','421C','431C','441C','461C','471C','481C'];
const folderOf=x=>x.folder===undefined?'411C':(FOLDERS.includes(x.folder)?x.folder:'');
function render(){
 const q=$('search').value.trim();
 $('headerTotal').textContent=items.length;
 const filtered=items.filter(x=>searchMatch(x,q)&&(activeFilter==='すべて'||(activeFilter==='その他'?destinationType(x)==='その他':destinationType(x)===activeFilter)));
 document.querySelectorAll('.filter').forEach(b=>{const on=b.dataset.filter===activeFilter;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
 const makeList=a=>{const groups=new Map();for(const x of a){if(!groups.has(x.customer))groups.set(x.customer,[]);groups.get(x.customer).push(x)}return a.length?[...groups].map(([name,places])=>'<details class="company-group" '+(q?'open':'')+'><summary><span class="company-title">'+esc(name)+'</span><span class="company-count">'+places.length+' 件</span></summary><div class="company-places">'+places.map(x=>'<article class="destination"><span class="tag">'+esc(destinationType(x))+'</span><h2>'+esc(x.place||x.customer)+'</h2>'+(x.address?'<p class="muted">📍 '+esc(x.address)+'</p>':'')+(x.memo?'<p class="muted" style="white-space:pre-wrap">'+esc(x.memo)+'</p>':'')+(x.photo?'<img class="photo" alt="納品先写真" src="'+x.photo+'">':'')+'<div class="actions">'+(!coordinatesReady&&x.maplink&&!x.address?'<button class="btn" type="button" disabled>地図を準備中…</button>':'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(mapurl(x))+'">➤ ナビ開始</a>')+'<button class="secondary edit" data-id="'+esc(x.id)+'">編集</button><button class="danger del" data-id="'+esc(x.id)+'">削除</button></div></article>').join('')+'</div></details>').join(''):'<div class="empty">該当する納品先がありません。</div>'};
 const root=$('folderGroups');const previous={};root.querySelectorAll('details.folder-group').forEach(d=>previous[d.dataset.folder||'411C']=d.open);
 root.innerHTML=FOLDERS.map(folder=>{const a=filtered.filter(x=>folderOf(x)===folder);const count=items.filter(x=>folderOf(x)===folder).length;return '<details class="folder-group" data-folder="'+folder+'" '+((q||previous[folder])?'open':'')+'><summary><span class="folder-symbol">📁</span><span class="folder-label">'+folder+'</span><span class="folder-total">'+count+'件</span></summary><div class="folder-content"><div class="muted">'+a.length+' 件の納品先</div>'+makeList(a)+'</div></details>'}).join('')+'<section class="folder-content" style="margin-top:20px"><h2>📍 フォルダ外（未指定）</h2>'+makeList(filtered.filter(x=>folderOf(x)===''))+'</section>';
 root.querySelectorAll('.edit').forEach(b=>b.onclick=()=>showEditor(items.find(x=>x.id===b.dataset.id)));
 root.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('この納品先を削除しますか？')){let old=items;items=items.filter(x=>x.id!==b.dataset.id);if(!save())items=old;else if(DEFAULTS.some(x=>x.id===b.dataset.id)){try{localStorage.setItem(REMOVED_KEY,JSON.stringify([...new Set([...removed(),b.dataset.id])]))}catch(e){}}render()}});
}

$('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;activeFilter=b.dataset.filter;render()});

$('reloadApp').onclick=()=>{const u=new URL(location.href);u.searchParams.set('refresh',String(Date.now()));location.replace(u.toString())};$('add').onclick=()=>showEditor(null);$('cancel').onclick=home;$('search').oninput=render;
$('photoFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){alert('10MB以下の写真を選んでください');return}try{let img=new Image();let url=URL.createObjectURL(f);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,1000/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(url);preview()}catch(err){alert('写真を読み込めませんでした')}};
$('form').onsubmit=e=>{e.preventDefault();let x={};for(let k of ['id','customer','place','kind','address','maplink','memo'])x[k]=$(k).value.trim();x.folder=$('folder').value;if(!x.address&&!x.maplink){alert('住所・座標・Plus Codeのいずれかを入力してください');return}if(x.address&&$('locationType').value==='coordinates'){const normalized=normalizeCoordinates(x.address);if(!normalized){alert('座標は (35.7033627, 138.4553752) または 35.7033627,138.4553752 の形式で入力してください');return}x.address=normalized}if(x.address&&$('locationType').value==='pluscode'&&!/[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}/i.test(x.address)){alert('Plus Codeを確認してください');return}x.id=x.id||String(Date.now())+'-'+Math.random().toString(36).slice(2);x.photo=photo;let old=items.slice(),i=items.findIndex(y=>y.id===x.id);if(i<0)items.unshift(x);else items[i]=x;if(save())home();else items=old};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'nouhinsaki-navi',version:1,items},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='納品先ナビ_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='nouhinsaki-navi'||!Array.isArray(data.items))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えます。続けますか？'))return;let old=items;items=data.items.filter(x=>x&&typeof x.id==='string'&&typeof x.customer==='string'&&typeof x.address==='string');if(!save())items=old;render()}catch(err){alert('対応するバックアップファイルではありません')}finally{e.target.value=''}};
load();render();
fetch('./map-coordinates.json?refresh=20261031-91',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('coordinate file unavailable');return r.json()}).then(data=>{verifiedCoordinates=data||{};coordinatesReady=true;render()}).catch(()=>{coordinatesReady=true;render()});
</script></body></html>
